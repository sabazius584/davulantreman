<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b2129;--ink:#e6e9ee;--mut:#9aa5b1;--line:#2c3541;--acc:#5eead4;--on:#b45309;--btn:#06201d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b2129;--ink:#e6e9ee;--mut:#9aa5b1;--line:#2c3541;--acc:#5eead4;--on:#b45309;--btn:#06201d;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:1000px;margin:0 auto;padding:14px}
h1{font-size:1.35rem;margin:6px 0 10px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tabs button{font:inherit;font-size:.86rem;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--acc);color:var(--btn);border-color:var(--acc);font-weight:600}
.tabs button:disabled{color:var(--mut);opacity:.55;cursor:default}
.g{display:grid;gap:14px}
@media(min-width:780px){.g{grid-template-columns:260px 1fr;align-items:start}}
#ls{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;max-height:72vh;overflow:auto}
#ls button{display:block;width:100%;text-align:left;font:inherit;font-size:.9rem;border:0;background:none;color:var(--ink);padding:7px 8px;border-radius:6px;cursor:pointer}
#ls button[aria-current=true]{background:var(--acc);color:var(--btn);font-weight:600}
#pl{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
#pl h2{margin:0;font-size:1.15rem}
#pl p{margin:2px 0;font-size:.95rem}#pl b{color:var(--acc)}
svg{display:block;width:100%;margin:8px 0 10px}
.hl{fill:transparent}.hl.on{fill:var(--on);opacity:.55}
.ct{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.ct label{display:flex;align-items:center;gap:6px;font-size:.9rem}
.ct output{min-width:3.4em;font-weight:600;font-variant-numeric:tabular-nums}
.ct input[type=range]{accent-color:var(--acc);width:130px}
.ct>button{font:inherit;font-weight:600;border:1px solid var(--acc);border-radius:8px;padding:9px 14px;background:none;color:var(--ink);cursor:pointer;min-height:44px}
#pb{background:var(--acc)!important;color:var(--btn)!important}
button:focus-visible,input:focus-visible{outline:3px solid var(--on);outline-offset:2px}
.vr{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 0;font-size:.88rem;color:var(--mut)}.vr button{font:inherit;min-width:34px;height:34px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer}.vr button[aria-pressed=true]{background:var(--acc);color:var(--btn);border-color:var(--acc);font-weight:600}
.k{color:var(--mut);font-size:.82rem;margin-top:10px}
</style></head><body><main>

<div class="tabs" id="sc"></div>
